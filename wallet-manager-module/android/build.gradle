// =============================================================================
// wallet-manager-module/android/build.gradle
// -----------------------------------------------------------------------------
// Android library wrapper required for:
//   1. React Native autolinking to discover this Nitro module
//   2. Applying nitrogen's autolinking.gradle (adds Kotlin sources)
//   3. Hooking the CMakeLists.txt into the gradle build
// =============================================================================

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.2.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '2.1.20')}"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

// Nitrogen-generated: adds kotlin srcDirs from nitrogen/generated/android/kotlin
apply from: '../nitrogen/generated/android/WalletManagerModule+autolinking.gradle'

android {
  namespace 'com.margelo.nitro.walletmgr'

  compileSdkVersion safeExtGet('compileSdkVersion', 36)
  buildToolsVersion safeExtGet('buildToolsVersion', '36.0.0')
  ndkVersion       safeExtGet('ndkVersion', '27.1.12297006')

  defaultConfig {
    minSdkVersion    safeExtGet('minSdkVersion',    24)
    targetSdkVersion safeExtGet('targetSdkVersion', 36)

    externalNativeBuild {
      cmake {
        cppFlags '-std=c++20'
        arguments '-DANDROID_STL=c++_shared'
      }
    }

    // Restrict build to the ABIs we have vendored binaries for.
    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }

  // Bundle vendored libTrustWalletCore.so into the APK alongside our module.
  // Each ABI subdirectory under android/vendor/ is mapped to APK lib/<abi>/.
  sourceSets {
    main {
      jniLibs.srcDirs = ['vendor']
    }
  }

  // jniLibs.srcDirs picks up <vendor>/<abi>/*.so. The headers tree under
  // vendor/include/ would otherwise be packaged as well — exclude it.
  packagingOptions {
    jniLibs {
      excludes += ['**/include/**']
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.facebook.react:hermes-android'
  // Intentionally NO 'com.trustwallet:wallet-core-kotlin' dependency.
  // TrustWalletCore is vendored as a prebuilt .so under android/vendor/<abi>/
  // (produced by scripts/build-wallet-core.sh) and packaged via jniLibs.
}
